<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#F1E8D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- Brand mark gradients (match favicon) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="55%" stop-color="#0B5D57"/>
      <stop offset="100%" stop-color="#083832"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <radialGradient id="sparkGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="brainHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#5EEAD4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Brand mark (large version of the new logo) on the left -->
  <g transform="translate(110, 195)">
    <!-- Background rounded square -->
    <rect width="240" height="240" rx="56" fill="url(#bgGrad)"/>
    <rect x="2" y="2" width="236" height="236" rx="54" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="2"/>

    <!-- Gauge ring -->
    <circle cx="120" cy="120" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>

    <!-- Cardinal tick marks -->
    <g stroke="#5EEAD4" stroke-opacity="0.4" stroke-linecap="round" stroke-width="2.5">
      <line x1="120" y1="14" x2="120" y2="24"/>
      <line x1="120" y1="216" x2="120" y2="226"/>
      <line x1="14" y1="120" x2="24" y2="120"/>
      <line x1="216" y1="120" x2="226" y2="120"/>
    </g>

    <!-- Halo -->
    <circle cx="120" cy="120" r="85" fill="url(#brainHalo)"/>

    <!-- Neural connection lines -->
    <g stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round" opacity="0.6" fill="none">
      <path d="M 80 100 Q 105 88 120 102"/>
      <path d="M 120 102 Q 135 88 160 100"/>
      <path d="M 80 140 Q 105 128 120 142"/>
      <path d="M 120 142 Q 135 128 160 140"/>
      <path d="M 120 102 L 120 142"/>
      <path d="M 80 100 L 80 140"/>
      <path d="M 160 100 L 160 140"/>
    </g>

    <!-- Neural nodes -->
    <g fill="#5EEAD4" opacity="0.9">
      <circle cx="80" cy="100" r="5"/>
      <circle cx="120" cy="102" r="6.5"/>
      <circle cx="160" cy="100" r="5"/>
      <circle cx="80" cy="140" r="5"/>
      <circle cx="120" cy="142" r="6.5"/>
      <circle cx="160" cy="140" r="5"/>
    </g>

    <!-- Brain silhouette -->
    <path d="
      M 120 52
      C 94 52 71 67 64 90
      C 53 94 49 105 53 116
      C 45 120 45 131 53 135
      C 49 142 53 150 60 154
      C 64 169 79 180 94 180
      L 94 184
      C 94 188 97 192 101 192
      L 139 192
      C 143 192 146 188 146 184
      L 146 180
      C 161 180 176 169 180 154
      C 187 150 191 142 187 135
      C 195 131 195 120 187 116
      C 191 105 187 94 176 90
      C 169 67 146 52 120 52
      Z
    " fill="url(#brainGrad)" opacity="0.97"/>

    <!-- Center division -->
    <path d="M 120 56 L 120 176" stroke="#0F766E" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Brain folds -->
    <g stroke="#0F766E" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.35">
      <path d="M 86 78 Q 101 67 113 82"/>
      <path d="M 127 82 Q 139 67 154 78"/>
      <path d="M 79 112 Q 94 101 105 116"/>
      <path d="M 135 116 Q 146 101 161 112"/>
    </g>

    <!-- Amber spark -->
    <path d="
      M 187 30
      L 194 52
      L 216 60
      L 194 68
      L 187 90
      L 180 68
      L 158 60
      L 180 52
      Z
    " fill="url(#sparkGrad)"/>
    <circle cx="187" cy="60" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Site name and tagline -->
  <text x="390" y="270" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="700" fill="#0F1B17">Einstein IQ Test</text>
  <text x="390" y="325" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="500" fill="#475569">Free Online Einstein IQ Test | Logical Reasoning Quiz</text>
  <text x="390" y="380" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B">25 mixed reasoning questions. Instant feedback. Estimated IQ score.</text>

  <!-- CTA button -->
  <g transform="translate(390, 425)">
    <rect width="260" height="56" rx="12" fill="#0F766E"/>
    <text x="130" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="white">Start IQ Test</text>
  </g>

  <!-- URL footer -->
  <text x="1130" y="600" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8">einsteiniqtest.vercel.app</text>
</svg>
