<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0A4A45"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F4F1"/>
    </linearGradient>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>

  <!-- Background: rounded square with deep emerald gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle inner shadow / highlight for premium depth -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="white" stroke-opacity="0.08"/>

  <!-- Brain silhouette: simplified, recognizable at small sizes -->
  <path d="
    M 32 13
    C 24 13 17 17 14 23
    C 11 25 11 30 14 32
    C 12 34 12 37 14 38
    C 13 40 13 42 15 43
    C 16 47 20 50 25 50
    L 25 51
    C 25 52 26 53 27 53
    L 37 53
    C 38 53 39 52 39 51
    L 39 50
    C 44 50 48 47 49 43
    C 51 42 51 40 50 38
    C 52 37 52 34 50 32
    C 53 30 53 25 50 23
    C 47 17 40 13 32 13
    Z
  " fill="url(#brainGrad)"/>

  <!-- Center division: subtle vertical line showing two hemispheres -->
  <path d="M 32 14 L 32 50" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Brain fold lines: visible at larger sizes, fades at 16x16 (which is fine) -->
  <path d="
    M 22 22 Q 26 19 29 23
    M 35 23 Q 38 19 42 22
    M 20 30 Q 24 27 28 31
    M 36 31 Q 40 27 44 30
  " stroke="#0F766E" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Amber 4-pointed spark: Einstein's "aha!" moment -->
  <path d="
    M 52 9
    L 54 14
    L 59 16
    L 54 18
    L 52 23
    L 50 18
    L 45 16
    L 50 14
    Z
  " fill="url(#sparkGrad)"/>
</svg>
